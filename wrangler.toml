name = "wa-orbit"
main = "worker/src/index.js"
compatibility_date = "2026-11-02"

# The existing dashboard remains hosted by the Express service until its D1 session/API migration is complete.
[[d1_databases]]
binding = "DB"
database_name = "wa-orbit-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[vars]
BOT_AUTO_REPLY_ENABLED = "false"
GROQ_DRAFTS_ENABLED = "false"
GROQ_MODEL = "openai/gpt-oss-20b"
GROQ_MAX_DRAFTS_PER_DAY = "30"
GROQ_MAX_DRAFTS_PER_CONTACT_PER_HOUR = "3"

[triggers]
crons = ["0 8 * * *"]
