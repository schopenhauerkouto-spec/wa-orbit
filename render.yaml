services:
  - type: web
    name: wa-orbit
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_DATABASE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: "160"
      - key: GROQ_FREE_TIER_MODE
        value: "true"
      - key: GROQ_FREE_RPM
        value: "25"
      - key: GROQ_FREE_RPD
        value: "900"
      - key: GROQ_FREE_TPM
        value: "7000"
      - key: GROQ_FREE_TPD
        value: "180000"
      - key: BOT_AUTO_REPLY_ENABLED
        value: "false"
      - key: BOT_MAX_AUTO_REPLIES_PER_DAY
        value: "50"
      - key: BOT_MAX_REPLIES_PER_CONTACT_PER_HOUR
        value: "3"
