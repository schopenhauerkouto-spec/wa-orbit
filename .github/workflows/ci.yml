name: WA Orbit checks

on:
  push:
    branches: [main, feat/remote-connection-safety-foundation, feat/cloudflare-workers-foundation, feat/personality-relationship-engine]
  pull_request:
    branches: [main, feat/remote-connection-safety-foundation, feat/cloudflare-workers-foundation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax and run smoke tests
        run: npm test
